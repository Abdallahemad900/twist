name: Build Twist website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check bilingual content and model integrity
        run: npm run check
      - name: Build production website
        run: npm run build
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: twist-production
          path: |
            dist/
            verification.json
          if-no-files-found: error
          retention-days: 14
